name: CI

on:
  push:
    branches:
      - main
      - work/requirements-implementation
      - feature/payment-confirmation-outbox
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-prod.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Compile application, tests, and scripts
        run: python -m compileall -q app tests main.py scripts

      - name: Apply Alembic migrations to PostgreSQL
        env:
          MIGRATOR_DB_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: ci
          STRIPE_API_KEY: sk_test_ci
          RESEND_API_KEY: re_test_ci
          JWT_SECRET_KEY: ci-only-secret-key
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
        run: alembic upgrade head

      - name: Import application and configure ORM mappings
        env:
          STRIPE_API_KEY: sk_test_ci
          RESEND_API_KEY: re_test_ci
          MIGRATOR_DB_URL: postgresql://ci:ci@localhost:5432/ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: ci
          JWT_SECRET_KEY: ci-only-secret-key
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
        run: python -c "import main; print(f'Loaded {len(main.app.routes)} API routes')"

      - name: Run unit tests
        run: python -m pytest -q
