name: CI

on:
  push:
    branches:
      - main
      - work/requirements-implementation
      - feature/payment-confirmation-outbox
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-prod.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Compile application and tests
        run: python -m compileall -q app tests main.py

      - name: Run unit tests
        run: python -m pytest -q
