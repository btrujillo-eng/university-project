[tool.ruff]
src = ["."]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "RUF022"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form"
]

[tool.pytest.ini_options]
pythonpath = ["."]
